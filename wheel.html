<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lovense remote toy">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Колесо призов</title>
    <link rel="stylesheet" href="/workspace-theme.css">
    <script src="/workspace-theme.js"></script>
    <style>
        * { box-sizing:border-box; }
        body.work-ui { margin:0; padding:28px 18px; font:14px/1.5 var(--work-font); background:var(--work-bg); color:var(--work-text); min-height:100vh; }
        .container { width:100%; max-width:620px; margin:0 auto; }
        .page-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:30px; }
        .page-label { color:var(--work-muted); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
        body.work-ui button { font:550 13px/1.4 var(--work-font); color:var(--work-text); background:var(--work-surface-2); border:1px solid var(--work-border); border-radius:var(--work-radius); min-height:36px; padding:8px 12px; cursor:pointer; }
        button:hover { border-color:var(--work-muted); }
        button:disabled { opacity:.55; cursor:wait; }
        :where(button,input,a):focus-visible { outline:2px solid var(--work-accent); outline-offset:3px; }
        .header { margin-bottom:24px; }
        .header h1 { margin:0 0 7px; font-size:27px; font-weight:650; line-height:1.3; letter-spacing:-.03em; }
        .header p { margin:0; color:var(--work-muted); font-size:13px; }
        .code-section { padding:20px; margin-bottom:16px; background:var(--work-surface); border:1px solid var(--work-border); border-radius:var(--work-radius); }
        .code-label { display:block; margin-bottom:8px; font-size:12px; font-weight:500; color:var(--work-muted); }
        .code-input-group { display:flex; align-items:stretch; gap:10px; }
        body.work-ui .code-input { flex:1; width:100%; min-width:0; font:500 15px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.08em; border:1px solid var(--work-border); border-radius:var(--work-radius); padding:10px 12px; background:var(--work-bg); color:var(--work-text); }
        .code-input::placeholder { color:var(--work-muted); letter-spacing:0; font:400 13px/1.4 var(--work-font); }
        body.work-ui .spin-btn { min-width:132px; border-color:var(--work-accent); color:var(--work-on-accent); background:var(--work-accent); }
        body.work-ui .spin-btn:hover:not(:disabled) { background:var(--work-accent-hover); border-color:var(--work-accent-hover); }
        .sound-option { display:inline-flex; align-items:center; gap:8px; margin-top:14px; font-size:12px; color:var(--work-muted); cursor:pointer; }
        .sound-option input { accent-color:var(--work-accent); margin:0; width:15px; height:15px; }
        .wheel-container { position:relative; text-align:center; background:var(--work-surface); border:1px solid var(--work-border); border-radius:var(--work-radius); padding:24px; }
        .wheel-wrapper { display:inline-block; position:relative; max-width:100%; vertical-align:top; }
        .wheel-canvas { display:block; max-width:100%; border-radius:50%; }
        .pointer { position:absolute; top:1px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:20px solid var(--work-text); z-index:2; }
        .wheel-caption { font-size:12px; color:var(--work-muted); margin:14px 0 0; }
        .error-message { display:none; color:var(--work-danger); margin-top:14px; font-size:13px; }
        .error-message.show { display:block; }
        .loading { display:none; color:var(--work-muted); font-size:12px; margin-top:14px; }
        .loading.show { display:flex; gap:8px; align-items:center; }
        .spinner { display:none; }
        .result-card { margin-top:16px; padding:18px 20px; background:var(--work-accent-soft); border:1px solid var(--work-border); border-radius:var(--work-radius); }
        .result-card[hidden] { display:none; }
        .result-card h2 { margin:0 0 5px; font-size:12px; color:var(--work-muted); font-weight:500; }
        .result-card p { margin:0; font-size:20px; font-weight:600; overflow-wrap:anywhere; }
        .result-note { display:block; margin-top:7px; color:var(--work-muted); font-size:12px; }
        @media(max-width:480px) {
            body.work-ui { padding:18px 12px; }
            .page-tools { margin-bottom:24px; }
            .header h1 { font-size:24px; }
            .code-section { padding:16px; }
            .code-input-group { flex-direction:column; }
            body.work-ui .code-input { font-size:16px; }
            body.work-ui .spin-btn { width:100%; }
            .wheel-container { padding:16px; }
        }
        @media(prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
    </style>
</head>

<body class="work-ui wheel-page">
    <!-- Audio elements -->
    <audio id="spinSound" loop preload="auto">
        <source src="spin.mp3" type="audio/mpeg">
    </audio>
    <audio id="winSound" preload="auto">
        <source src="win.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <main class="container">
        <div class="page-tools">
            <span class="page-label">Панель · Призы</span>
            <button type="button" data-work-theme-toggle>Светлая тема</button>
        </div>
        <header class="header">
            <h1>Колесо призов</h1>
            <p>Введите полученный код, чтобы открыть свой приз.</p>
        </header>

        <section class="code-section" aria-label="Открытие приза">
            <label class="code-label" for="codeInput">Код доступа</label>
            <div class="code-input-group">
                <input type="text" id="codeInput" class="code-input" placeholder="Введите код" maxlength="8" autocomplete="off" spellcheck="false">
                <button id="spinBtn" class="spin-btn" type="button">Открыть приз</button>
            </div>
            <label class="sound-option"><input type="checkbox" id="soundEnabled">Звуковое сопровождение</label>
            <div id="errorMessage" class="error-message" role="alert"></div>
            <div id="loading" class="loading" role="status"><span>Проверяем и сохраняем результат…</span></div>
        </section>

        <div class="wheel-container">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" class="wheel-canvas" width="400" height="400" role="img" aria-label="Колесо с возможными призами. Результат появится под колесом."></canvas>
                <div class="pointer" aria-hidden="true"></div>
            </div>
            <p class="wheel-caption">Один код — одно открытие</p>
        </div>
        <section id="wheelResult" class="result-card" role="status" hidden>
            <h2>Ваш приз</h2><p id="wheelResultPrize"></p>
            <span class="result-note">Результат сохранён.</span>
        </section>
    </main>

    <script>
        // Prizes on the wheel
        const prizes = [
            'Lovense', 'Threesome', 'Fucklist', 'Sexting', 'Custom',
            'Videocall', 'Anal', 'Pussy', 'Nudes', 'Squirt'
        ];

        // Restrained sector colors remain distinct without animated decoration.
        const colors = [
            '#304459', '#43576b', '#344958', '#536071', '#354657',
            '#405a70', '#35495f', '#4d5d6c', '#364e65', '#445468'
        ];
        const reduceMotion = () => typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const soundEnabled = () => document.getElementById('soundEnabled').checked;

        let canvas = null;
        let ctx = null;
        let currentRotation = 0;
        let targetRotation = 0;
        let isSpinning = false;
        let isChecking = false;
        let isSavingResult = false;
        let pendingWheelResult = null;
        let currentCode = '';
        let targetPrize = '';
        let animationId = null;

        // Audio elements
        const spinSound = document.getElementById('spinSound');
        const winSound = document.getElementById('winSound');
        const bgMusic = document.getElementById('bgMusic');

        // Set background music volume (quieter)
        bgMusic.volume = 0.3;

        // Track if user has interacted (for autoplay policy)
        let userInteracted = false;

        // Initialize wheel
        function initWheel() {
            canvas = document.getElementById('wheelCanvas');
            ctx = canvas.getContext('2d');

            // Set canvas size - make it responsive
            const containerWidth = document.querySelector('.wheel-container').offsetWidth;
            const isMobile = window.innerWidth <= 768;
            const size = Math.floor(Math.max(140, Math.min(isMobile ? 350 : 400, containerWidth - (isMobile ? 32 : 48))));

            canvas.width = size;
            canvas.height = size;
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';

            drawWheel();
        }

        // Redraw on window resize
        window.addEventListener('resize', () => {
            if (!isSpinning) {
                initWheel();
            }
        });

        // Draw wheel
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = (canvas.width / 2) - 20; // Responsive radius

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Save state
            ctx.save();

            // Move to center and rotate
            ctx.translate(centerX, centerY);
            ctx.rotate((currentRotation * Math.PI) / 180);

            // Draw sectors
            const anglePerSector = (2 * Math.PI) / prizes.length;

            prizes.forEach((prize, index) => {
                const startAngle = index * anglePerSector;
                const endAngle = (index + 1) * anglePerSector;

                // Draw sector
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[index];
                ctx.fill();

                // Draw sector border with glow effect
                ctx.strokeStyle = '#182431';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw text
                const textAngle = startAngle + anglePerSector / 2;
                const textRadius = radius * 0.7;
                const textX = Math.cos(textAngle) * textRadius;
                const textY = Math.sin(textAngle) * textRadius;

                ctx.save();
                ctx.translate(textX, textY);
                ctx.rotate(textAngle + Math.PI / 2);
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#000';

                // Responsive font size based on canvas size
                const baseFontSize = Math.max(10, Math.floor(canvas.width / 28));
                ctx.lineWidth = Math.max(2, Math.floor(baseFontSize / 6));
                ctx.font = `500 ${baseFontSize}px system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Draw text with better shadow for readability
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillText(prize, 0, 0);
                ctx.restore();
            });

            // Draw center circle (responsive)
            const centerRadius = Math.max(25, canvas.width / 15);
            ctx.beginPath();
            ctx.arc(0, 0, centerRadius, 0, 2 * Math.PI);
            ctx.fillStyle = '#182431';
            ctx.fill();
            ctx.strokeStyle = '#637d96';
            ctx.lineWidth = Math.max(3, canvas.width / 100);
            ctx.stroke();

            // Restore state
            ctx.restore();
        }

        // Animation with easing
        let startTime = 0;
        let duration = 10000; // 10 seconds
        let startRotation = 0;

        function animate(timestamp) {
            if (!isSpinning) {
                // Очищаем animationId если анимация остановлена
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                return;
            }

            if (startTime === 0) {
                startTime = timestamp;
                startRotation = currentRotation;
            }

            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Easing function for smooth deceleration (ease-out cubic)
            const easeOut = 1 - Math.pow(1 - progress, 3);

            // Apply easing to rotation
            currentRotation = startRotation + (targetRotation - startRotation) * easeOut;

            drawWheel();

            if (progress < 1) {
                animationId = requestAnimationFrame(animate);
            } else {
                // Wheel stopped - set final angle precisely
                currentRotation = targetRotation;
                isSpinning = false;
                startTime = 0;
                animationId = null; // Очищаем ID
                drawWheel();

                // Determine winning prize
                const winningPrize = getWinningPrize();
                pendingWheelResult = { code: currentCode, prize: winningPrize };
                sendResult();
            }
        }

        // Determine winning prize
        function getWinningPrize() {
            // Pointer is at the top (270 degrees in canvas coordinates)
            // Normalize currentRotation to 0-360 range
            let normalizedRotation = currentRotation % 360;
            if (normalizedRotation < 0) normalizedRotation += 360;

            // Find which sector is under the pointer (top = 270°)
            let normalizedAngle = (270 - normalizedRotation);
            if (normalizedAngle < 0) normalizedAngle += 360;

            // Determine sector
            const anglePerSector = 360 / prizes.length;
            const sectorIndex = Math.floor(normalizedAngle / anglePerSector);

            // Ensure correct index
            const finalIndex = sectorIndex >= prizes.length ? 0 : sectorIndex;

            console.log('Prize determination: currentRotation:', currentRotation, 'normalizedRotation:', normalizedRotation, 'normalizedAngle:', normalizedAngle, 'sectorIndex:', sectorIndex, 'finalIndex:', finalIndex, 'prize:', prizes[finalIndex]);

            return prizes[finalIndex];
        }

        // Start background music (only once)
        function startBackgroundMusic() {
            if (soundEnabled() && !userInteracted) {
                userInteracted = true;
                bgMusic.play().catch(err => {
                    console.log('Background music autoplay prevented:', err);
                });
            }
        }

        // Spin the wheel
        function spinWheel(targetPrizeName) {
            if (isSpinning) return;

            // Start background music on first interaction
            startBackgroundMusic();

            // Play spin sound
            document.getElementById('wheelResult').hidden = true;
            if (soundEnabled() && !reduceMotion()) {
                spinSound.currentTime = 0;
                spinSound.play().catch(err => console.log('Spin sound error:', err));
            }

            isSpinning = true;
            startTime = 0; // Reset time
            currentRotation = 0; // Reset current rotation

            // Find target prize index
            const targetIndex = prizes.indexOf(targetPrizeName);
            console.log('Spinning wheel for prize:', targetPrizeName, 'Index:', targetIndex);

            if (targetIndex === -1) {
                // Random prize
                targetRotation = 1800 + Math.random() * 360;
                console.log('Random prize, targetRotation:', targetRotation);
            } else {
                // Specific prize - calculate so pointer lands on correct sector
                const anglePerSector = 360 / prizes.length;
                // Pointer at top (270°), target sector should be rotated to this angle
                // Add half sector to point at center, not border
                const targetAngle = targetIndex * anglePerSector + anglePerSector / 2;

                // Calculate target angle: need sector at 270°
                // normalizedRotation should be = (270 - targetAngle)
                let targetNormalized = (270 - targetAngle);
                if (targetNormalized < 0) targetNormalized += 360;

                // Add several full rotations for excitement
                const fullRotations = Math.floor(5 + Math.random() * 3); // 5-7 rotations

                // Final position = full rotations + target angle
                targetRotation = (fullRotations * 360) + targetNormalized;

                console.log('Target prize, anglePerSector:', anglePerSector, 'targetAngle:', targetAngle, 'targetNormalized:', targetNormalized, 'fullRotations:', fullRotations, 'targetRotation:', targetRotation);
            }

            if (reduceMotion()) {
                currentRotation = targetRotation;
                isSpinning = false;
                drawWheel();
                pendingWheelResult = { code: currentCode, prize: getWinningPrize() };
                sendResult();
            } else {
                requestAnimationFrame(animate);
            }
        }

        // Announce a result only after the server has persisted it.
        function showResult(prize) {
            spinSound.pause();
            spinSound.currentTime = 0;
            if (soundEnabled()) {
                winSound.currentTime = 0;
                winSound.play().catch(err => console.log('Win sound error:', err));
            }
            document.getElementById('wheelResultPrize').textContent = prize;
            document.getElementById('wheelResult').hidden = false;
        }

        // Send result to server
        async function sendResult() {
            if (!pendingWheelResult || isSavingResult) return false;
            isSavingResult = true;
            const result = { ...pendingWheelResult };
            const button = document.getElementById('spinBtn');
            button.disabled = true;
            showLoading(true);
            hideError();
            try {
                const response = await fetch('/api/wheel/result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(result)
                });
                const data = await response.json();
                if (!response.ok || !data.ok || data.prize !== result.prize) throw new Error(data.error || 'save_failed');
                pendingWheelResult = null;
                button.textContent = 'Открыть приз';
                showResult(result.prize);
                return true;
            } catch (error) {
                // Keep the exact result/code for an idempotent retry, rather than
                // awarding an unrecorded prize or consuming a different code.
                spinSound.pause();
                button.textContent = 'Повторить сохранение';
                showError('Результат пока не подтверждён. Проверьте соединение и повторите сохранение.');
                return false;
            } finally {
                isSavingResult = false;
                button.disabled = false;
                showLoading(false);
            }
        }

        // Check code and spin wheel
        async function checkCodeAndSpin() {
            if (isChecking || isSavingResult) return;
            if (pendingWheelResult) { await sendResult(); return; }
            const codeInput = document.getElementById('codeInput');
            const code = codeInput.value.trim().toUpperCase();

            if (!code) {
                showError('Введите код доступа.');
                return;
            }

            if (isSpinning) {
                showError('Дождитесь завершения открытия.');
                return;
            }

            isChecking = true;
            document.getElementById('spinBtn').disabled = true;
            showLoading(true);
            hideError();

            try {
                const response = await fetch('/api/wheel/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Код недействителен.');
                    showLoading(false);
                    return;
                }

                if (!prizes.includes(data.targetPrize)) throw new Error('invalid_prize');

                // Code is valid, spin the wheel
                currentCode = code;
                console.log('Code verified, target prize:', data.targetPrize);
                showLoading(false);
                spinWheel(data.targetPrize);

            } catch (error) {
                console.error('Error checking code:', error);
                showError('Не удалось проверить код. Проверьте соединение и попробуйте снова.');
                showLoading(false);
            } finally {
                isChecking = false;
                document.getElementById('spinBtn').disabled = isSpinning || isSavingResult;
            }
        }

        // Show error
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Hide error
        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        // Show/hide loading
        function showLoading(show) {
            const loadingEl = document.getElementById('loading');
            if (show) {
                loadingEl.classList.add('show');
            } else {
                loadingEl.classList.remove('show');
            }
        }

        // Event handlers
        document.getElementById('spinBtn').addEventListener('click', checkCodeAndSpin);

        document.getElementById('codeInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkCodeAndSpin();
            }
        });

        // Sounds are opt-in; focusing a field or changing the theme stays silent.
        document.getElementById('soundEnabled').addEventListener('change', () => {
            if (soundEnabled()) {
                userInteracted = false;
                startBackgroundMusic();
            } else {
                [bgMusic, spinSound, winSound].forEach(audio => audio.pause());
                userInteracted = false;
            }
        });

        window.addEventListener('load', initWheel);
    </script>
</body>

</html>
