<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lovense remote toy">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Журнал — Рабочая панель</title>
    <link rel="stylesheet" href="/workspace-theme.css">
    <script src="/workspace-theme.js"></script>
    <style>
        * { box-sizing: border-box; }
        body.work-ui { margin:0; padding:24px; font:14px/1.5 var(--work-font); color:var(--work-text); background:var(--work-bg); min-height:100vh; }
        .container { max-width:1400px; margin:0 auto; }
        .container.access-denied :is(.stats,.filters,.sessions-list) { display:none; }
        .page-header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
        .page-header nav { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
        .page-eyebrow { margin:0 0 4px; color:var(--work-muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
        h1 { margin:0; font-size:24px; line-height:1.3; font-weight:650; letter-spacing:-.03em; }
        .subtitle { margin:6px 0 0; color:var(--work-muted); font-size:13px; }
        button, input, select, .page-link { font:inherit; border:1px solid var(--work-border); border-radius:var(--work-radius); }
        button, .page-link { min-height:36px; padding:7px 12px; color:var(--work-text); background:var(--work-surface-2); cursor:pointer; text-decoration:none; font-size:13px; font-weight:550; }
        button:hover, .page-link:hover { background:var(--work-surface); border-color:var(--work-muted); }
        button:disabled { opacity:.55; cursor:wait; }
        :where(button,a,input,select):focus-visible { outline:2px solid var(--work-accent); outline-offset:3px; }
        .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); margin-bottom:20px; background:var(--work-surface); border:1px solid var(--work-border); border-radius:var(--work-radius); }
        .stat-item { padding:17px 20px; min-width:0; }
        .stat-item + .stat-item { border-left:1px solid var(--work-border); }
        .stat-value { font-size:23px; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
        .stat-label { color:var(--work-muted); font-size:12px; margin-top:3px; }
        .filters { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
        .filters input, .filters select { min-height:36px; padding:7px 10px; background:var(--work-surface); color:var(--work-text); min-width:0; }
        .filters input { flex:1 1 230px; }
        input::placeholder { color:var(--work-muted); }
        .filters .export-btn { background:var(--work-accent); color:var(--work-on-accent); border-color:var(--work-accent); }
        .filters .export-btn:hover { background:var(--work-accent-hover); }
        body.work-ui .cleanup-btn, body.work-ui .btn-delete-log { color:var(--work-danger); }
        .btn-delete-log { min-height:28px; padding:3px 8px; font-size:12px; margin-left:8px; background:transparent; }
        .sessions-list { background:var(--work-surface); border:1px solid var(--work-border); border-radius:var(--work-radius); overflow:auto; max-height:calc(100vh - 275px); min-height:160px; }
        .session-item { padding:16px 18px; border-bottom:1px solid var(--work-border); }
        .session-item:last-child { border-bottom:0; }
        .session-item:hover { background:var(--work-surface-2); }
        .session-item.active { background:var(--work-accent-soft); }
        .session-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
        .session-header > div { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
        .session-id { color:var(--work-text); font:550 13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; overflow-wrap:anywhere; min-width:0; }
        body.work-ui button.session-id { background:transparent; padding:0; min-height:28px; border:0; text-align:left; color:var(--work-text); }
        body.work-ui button.session-id:hover { text-decoration:underline; }
        .session-status { display:inline-block; padding:2px 7px; border:1px solid var(--work-border); border-radius:4px; font-size:11px; color:var(--work-muted); white-space:nowrap; }
        .session-status.active { color:var(--work-success); }
        .session-status.revoked, .session-status.deleted { color:var(--work-danger); }
        .session-info { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:7px 18px; font-size:12px; color:var(--work-text); }
        .info-item { display:flex; flex-wrap:wrap; align-items:baseline; gap:5px; min-width:0; overflow-wrap:anywhere; }
        .info-label { color:var(--work-muted); }
        .chat-viewer { position:fixed; inset:0 0 0 auto; width:min(620px,55%); background:var(--work-bg); border-left:1px solid var(--work-border); display:none; flex-direction:column; z-index:1000; box-shadow:var(--work-shadow); }
        .chat-viewer.show { display:flex; }
        .chat-header { padding:18px; border-bottom:1px solid var(--work-border); display:flex; gap:16px; align-items:flex-start; justify-content:space-between; background:var(--work-surface); }
        .chat-header h2 { margin:0; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
        .close-chat { min-height:30px; flex-shrink:0; padding:3px 10px; font-size:18px; }
        .chat-messages { flex:1; min-height:0; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
        .message { padding:11px 13px; border:1px solid var(--work-border); border-radius:var(--work-radius); max-width:88%; overflow-wrap:anywhere; font-size:13px; }
        .message.admin { background:var(--work-accent-soft); align-self:flex-end; }
        .message.controller { background:var(--work-surface); align-self:flex-start; }
        .message.system { background:var(--work-surface-2); align-self:center; text-align:center; font-size:12px; color:var(--work-muted); max-width:95%; white-space:pre-line; }
        .message-time { font-size:11px; color:var(--work-muted); margin-top:5px; font-variant-numeric:tabular-nums; }
        .voice-message { display:flex; align-items:center; gap:10px; margin-top:8px; }
        .voice-play-btn { width:34px; min-height:34px; flex-shrink:0; padding:0; }
        .no-data, .loading { padding:46px 20px; text-align:center; color:var(--work-muted); }
        .error-message { padding:12px 14px; border:1px solid var(--work-danger); color:var(--work-danger); background:var(--work-surface); margin-bottom:16px; border-radius:var(--work-radius); }
        .diff-box { width:100%; background:var(--work-bg); padding:8px; border:1px solid var(--work-border); max-height:200px; overflow:auto; border-radius:4px; }
        .diff-line { padding:3px 6px; margin:2px 0; background:var(--work-surface-2); }
        .diff-line.removed { color:var(--work-danger); }
        .diff-line.added { color:var(--work-success); }
        .diff-summary { color:var(--work-muted); font-style:italic; }
        @media(max-width:850px) {
            body.work-ui { padding:18px; }
            .page-header { align-items:flex-start; }
            .stats { grid-template-columns:repeat(3,minmax(0,1fr)); }
            .stat-item { padding:13px; }
            .stat-item:nth-child(4) { border-left:0; }
            .stat-item:nth-child(n+4) { border-top:1px solid var(--work-border); }
            .sessions-list { max-height:none; }
        }
        @media(max-width:600px) {
            body.work-ui { padding:14px; }
            .page-header { flex-direction:column; gap:14px; }
            .page-header nav { width:100%; }
            .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .stat-item:nth-child(n) { border:0; }
            .stat-item:nth-child(even) { border-left:1px solid var(--work-border); }
            .stat-item:nth-child(n+3) { border-top:1px solid var(--work-border); }
            .stat-value { font-size:20px; }
            .stat-item:last-child { grid-column:1 / -1; }
            .filters { gap:8px; }
            .filters select { flex:1 1 140px; }
            .filters button { flex:1 1 auto; }
            .session-header { align-items:flex-start; flex-direction:column; }
            .session-info { grid-template-columns:1fr; }
            .chat-viewer { width:100%; }
            .message { max-width:95%; }
        }
    </style>
</head>

<body class="work-ui logs-page">
    <div class="container" id="appRoot" style="display:none;">
        <header class="page-header">
            <div><p class="page-eyebrow">Рабочая панель</p><h1>Журнал</h1><p class="subtitle">История сессий, сообщений и изменений</p></div>
            <nav aria-label="Навигация журнала">
                <a href="/admin" class="page-link">Вернуться к сессиям</a>
                <button type="button" data-work-theme-toggle>Светлая тема</button>
            </nav>
        </header>

        <div id="errorContainer" role="alert"></div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalSessions">0</div>
                <div class="stat-label">Всего сессий</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="activeSessions">0</div>
                <div class="stat-label">Активные</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="deletedSessions">0</div>
                <div class="stat-label">Удалённые</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalMessages">0</div>
                <div class="stat-label">Всего сообщений</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Пользователей</div>
            </div>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Поиск по ID или имени" aria-label="Поиск в журнале">
            <select id="statusFilter" aria-label="Статус сессии">
                <option value="all">Все статусы</option>
                <option value="active">Активные</option>
                <option value="revoked">Отозванные</option>
                <option value="deleted">Удалённые</option>
            </select>
            <select id="viewMode" aria-label="Раздел журнала">
                <option value="sessions">Сессии</option>
                <option value="registrations">Регистрации</option>
                <option value="snippets">Изменения сниппетов</option>
            </select>
            <button onclick="loadData()">Обновить</button>
            <button class="cleanup-btn" onclick="cleanupAllDeleted()">Очистить удалённые</button>
            <button class="export-btn" onclick="exportLogs()">Экспорт</button>
        </div>

        <div class="sessions-list" id="sessionsList">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <!-- Chat Viewer -->
    <aside class="chat-viewer" id="chatViewer" aria-labelledby="chatTitle">
        <div class="chat-header">
            <h2 id="chatTitle">История чата</h2>
            <button class="close-chat" aria-label="Закрыть историю чата" onclick="closeChatViewer()">×</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
    </aside>

    <script>
        let currentNickname = localStorage.getItem('nickname') || '';
        let allSessions = [];
        let allRegistrations = [];
        let allSnippetLogs = [];
        let currentSessionId = null;
        let accessGranted = false;
        let chatReturnFocus = null;

        // Проверка доступа
        async function checkAccess() {
            if (!currentNickname) {
                showError('Требуется авторизация. Пожалуйста, войдите через главную страницу.');
                return false;
            }

            try {
                const res = await fetch('/api/auth/check', {
                    headers: { 'X-Nickname': currentNickname }
                });

                if (!res.ok) {
                    showError('Требуется авторизация. Пожалуйста, войдите через главную страницу.');
                    return false;
                }

                const data = await res.json();
                // Only admins can view logs
                if (data.role !== 'admin') {
                    showError('У вас нет доступа к просмотру логов. Требуется роль admin.');
                    return false;
                }

                return true;
            } catch (e) {
                showError('Ошибка проверки доступа.');
                return false;
            }
        }

        // Функция для вычисления конкретных изменений между двумя текстами
        function getTextDiff(oldText, newText) {
            if (typeof oldText !== 'string' || typeof newText !== 'string') return null;

            const oldLines = oldText.split('\n');
            const newLines = newText.split('\n');
            const changes = [];

            // Простое сравнение по строкам
            const maxLines = Math.max(oldLines.length, newLines.length);

            for (let i = 0; i < maxLines; i++) {
                const oldLine = oldLines[i] || '';
                const newLine = newLines[i] || '';

                if (oldLine !== newLine) {
                    if (oldLine && !newLine) {
                        changes.push({ type: 'removed', line: i + 1, text: oldLine });
                    } else if (!oldLine && newLine) {
                        changes.push({ type: 'added', line: i + 1, text: newLine });
                    } else {
                        changes.push({ type: 'changed', line: i + 1, oldText: oldLine, newText: newLine });
                    }
                }
            }

            return changes;
        }

        // Форматирование diff для отображения
        function formatDiffHtml(oldContent, newContent) {
            const changes = getTextDiff(oldContent, newContent);
            if (!changes || changes.length === 0) {
                return '<div class="diff-summary">Нет видимых изменений</div>';
            }

            // Ограничиваем количество показываемых изменений
            const maxChanges = 10;
            const displayChanges = changes.slice(0, maxChanges);

            let html = '<div style="font-family:monospace;font-size:11px;">';

            displayChanges.forEach(change => {
                if (change.type === 'removed') {
                    html += `<div class="diff-line removed">- [строка ${change.line}] ${escapeHtml(change.text.substring(0, 100))}${change.text.length > 100 ? '...' : ''}</div>`;
                } else if (change.type === 'added') {
                    html += `<div class="diff-line added">+ [строка ${change.line}] ${escapeHtml(change.text.substring(0, 100))}${change.text.length > 100 ? '...' : ''}</div>`;
                } else if (change.type === 'changed') {
                    html += `<div class="diff-line removed">- [строка ${change.line}] ${escapeHtml(change.oldText.substring(0, 100))}${change.oldText.length > 100 ? '...' : ''}</div>`;
                    html += `<div class="diff-line added">+ [строка ${change.line}] ${escapeHtml(change.newText.substring(0, 100))}${change.newText.length > 100 ? '...' : ''}</div>`;
                }
            });

            if (changes.length > maxChanges) {
                html += `<div class="diff-summary">... ещё ${changes.length - maxChanges} изменений</div>`;
            }

            html += '</div>';
            return html;
        }

        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
        }

        async function loadSessions() {
            try {
                const res = await fetch('/api/logs/sessions', {
                    headers: { 'X-Nickname': currentNickname }
                });

                if (!res.ok) {
                    throw new Error('Failed to load sessions');
                }

                const data = await res.json();
                allSessions = data.sessions || [];

                console.log('Loaded sessions:', allSessions.length);
                console.log('Deleted sessions:', allSessions.filter(s => s.deleted_at).length);

                if (document.getElementById('viewMode').value === 'sessions') renderSessions();
                updateStats();
            } catch (e) {
                showError('Ошибка загрузки сессий: ' + e.message);
            }
        }

        async function loadRegistrations() {
            try {
                const res = await fetch('/api/logs/registrations', {
                    headers: { 'X-Nickname': currentNickname }
                });

                if (!res.ok) {
                    throw new Error('Failed to load registrations');
                }

                const data = await res.json();
                allRegistrations = data.registrations || [];
                if (document.getElementById('viewMode').value === 'registrations') renderRegistrations();
                updateStats();
            } catch (e) {
                showError('Ошибка загрузки регистраций: ' + e.message);
            }
        }

        async function loadSnippetLogs() {
            try {
                const res = await fetch('/api/logs/snippets', {
                    headers: { 'X-Nickname': currentNickname }
                });

                if (!res.ok) {
                    throw new Error('Failed to load snippet logs');
                }

                const data = await res.json();
                allSnippetLogs = data.logs || [];
                if (document.getElementById('viewMode').value === 'snippets') renderSnippetLogs();
                updateStats();
            } catch (e) {
                showError('Ошибка загрузки логов сниппетов: ' + e.message);
            }
        }

        async function loadData() {
            const viewMode = document.getElementById('viewMode').value;
            document.getElementById('statusFilter').disabled = viewMode !== 'sessions';
            document.querySelector('.cleanup-btn').disabled = viewMode !== 'sessions';
            if (viewMode === 'sessions') {
                await loadSessions();
            } else if (viewMode === 'registrations') {
                await loadRegistrations();
            } else if (viewMode === 'snippets') {
                await loadSnippetLogs();
            }
        }

        function renderSessions() {
            const container = document.getElementById('sessionsList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            let filtered = allSessions.filter(session => {
                const matchesSearch = !searchTerm ||
                    session.id.toLowerCase().includes(searchTerm) ||
                    session.creator_nickname.toLowerCase().includes(searchTerm);

                // Более явная проверка deleted_at
                const isDeleted = session.deleted_at !== null && session.deleted_at !== undefined && session.deleted_at !== '';

                // PostgreSQL возвращает BOOLEAN (true/false), а не INTEGER (0/1)
                const isActive = session.is_active === true || session.is_active === 1;
                const isRevoked = session.revoked === true || session.revoked === 1;

                const matchesStatus = statusFilter === 'all' ||
                    (statusFilter === 'active' && isActive && !isRevoked && !isDeleted) ||
                    (statusFilter === 'revoked' && isRevoked && !isDeleted) ||
                    (statusFilter === 'deleted' && isDeleted);

                return matchesSearch && matchesStatus;
            });

            console.log('Filtered sessions:', filtered.length);
            console.log('Filter:', statusFilter);

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">Нет сессий для отображения</div>';
                return;
            }

            container.innerHTML = filtered.map(session => {
                let status, statusText;

                // PostgreSQL возвращает BOOLEAN (true/false), а не INTEGER (0/1)
                const isActive = session.is_active === true || session.is_active === 1;
                const isRevoked = session.revoked === true || session.revoked === 1;

                if (session.deleted_at) {
                    status = 'deleted';
                    statusText = 'Удалена';
                } else if (isRevoked) {
                    status = 'revoked';
                    statusText = 'Отозвана';
                } else if (isActive) {
                    status = 'active';
                    statusText = 'Активна';
                } else {
                    status = 'inactive';
                    statusText = 'Неактивна';
                }

                const createdDate = new Date(session.created_at);
                const expiresDate = session.expires_at ? new Date(session.expires_at) : null;
                const deletedDate = session.deleted_at ? new Date(session.deleted_at) : null;

                return `
                    <div class="session-item">
                        <div class="session-header">
                            <button type="button" class="session-id" data-view-session="${escapeHtml(session.id)}" aria-label="Открыть историю сессии ${escapeHtml(session.id)}">${escapeHtml(session.id)}</button>
                            <div>
                                <span class="session-status ${status}">${statusText}</span>
                                <button class="btn-delete-log" data-delete-session="${escapeHtml(session.id)}">Удалить</button>
                            </div>
                        </div>
                        <div class="session-info">
                            <div class="info-item">
                                <span class="info-label">Создатель:</span>
                                <span>${escapeHtml(session.creator_nickname)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Создана:</span>
                                <span>${formatDate(createdDate)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Истекает:</span>
                                <span>${expiresDate ? formatDate(expiresDate) : 'Никогда'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Сообщений:</span>
                                <span>${escapeHtml(session.message_count || 0)}</span>
                            </div>
                            ${deletedDate ? `
                            <div class="info-item">
                                <span class="info-label">Удалена:</span>
                                <span style="color:var(--work-danger);">${formatDate(deletedDate)}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRegistrations() {
            const container = document.getElementById('sessionsList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allRegistrations.filter(reg => {
                return !searchTerm ||
                    reg.nickname.toLowerCase().includes(searchTerm) ||
                    (reg.invited_by && reg.invited_by.toLowerCase().includes(searchTerm));
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">Нет регистраций для отображения</div>';
                return;
            }

            container.innerHTML = filtered.map(reg => {
                const registeredDate = new Date(reg.registered_at);
                const isMasterCode = reg.invited_by === 'MASTER_CODE';

                return `
                    <div class="session-item" style="cursor: default;">
                        <div class="session-header">
                            <span class="session-id">${escapeHtml(reg.nickname)}</span>
                            <div>
                                <span class="session-status ${isMasterCode ? 'active' : 'inactive'}">${isMasterCode ? 'Мастер-код' : 'Инвайт'}</span>
                                <button class="btn-delete-log" data-delete-user="${escapeHtml(reg.nickname)}">Удалить пользователя</button>
                            </div>
                        </div>
                        <div class="session-info">
                            <div class="info-item">
                                <span class="info-label">Пригласил:</span>
                                <span>${escapeHtml(reg.invited_by || 'Неизвестно')}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Код:</span>
                                <span style="font-family:monospace;">${escapeHtml(reg.invite_code)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Дата регистрации:</span>
                                <span>${formatDate(registeredDate)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderSnippetLogs() {
            const container = document.getElementById('sessionsList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allSnippetLogs.filter(log => {
                const matchesSearch = !searchTerm ||
                    log.user_nickname.toLowerCase().includes(searchTerm) ||
                    (log.item_name && log.item_name.toLowerCase().includes(searchTerm));
                return matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-data">Нет логов для отображения</div>';
                return;
            }

            container.innerHTML = filtered.map(log => {
                const timestamp = new Date(log.timestamp);

                let actionText = '';
                let actionColor = 'var(--work-muted)';
                switch (log.action) {
                    case 'create':
                        actionText = 'Создан';
                        actionColor = 'var(--work-success)';
                        break;
                    case 'edit':
                        actionText = 'Изменен';
                        actionColor = 'var(--work-accent)';
                        break;
                    case 'delete':
                        actionText = 'Удален';
                        actionColor = 'var(--work-danger)';
                        break;
                    default:
                        actionText = log.action;
                }

                const itemTypeName = log.item_type === 'snippet' ? 'Сниппет' : 'Папка';

                return `
                    <div class="session-item">
                        <div class="session-header">
                            <span class="session-id">
                                ${escapeHtml(log.item_name || 'Без названия')}
                            </span>
                            <span class="session-status" style="color:${actionColor};">${escapeHtml(actionText)}</span>
                        </div>
                        <div class="session-info">
                            <div class="info-item">
                                <span class="info-label">Тип:</span>
                                <span>${itemTypeName}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Пользователь:</span>
                                <span><strong>${escapeHtml(log.user_nickname)}</strong></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Дата:</span>
                                <span>${formatDate(timestamp)}</span>
                            </div>
                            ${log.details ? `
                            <div class="info-item" style="grid-column: 1 / -1;">
                                <span class="info-label">Детали:</span>
                                <span>${escapeHtml(log.details)}</span>
                            </div>
                            ` : ''}
                            ${typeof log.old_content === 'string' && typeof log.new_content === 'string' ? `
                            <div class="info-item" style="grid-column: 1 / -1;">
                                <span class="info-label">Изменения:</span>
                                <div class="diff-box">
                                    ${formatDiffHtml(log.old_content, log.new_content)}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function viewChat(sessionId) {
            currentSessionId = sessionId;
            if (!document.getElementById('chatViewer').classList.contains('show')) chatReturnFocus = document.activeElement;

            try {
                const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/messages`, {
                    headers: { 'X-Nickname': currentNickname }
                });

                if (!res.ok) {
                    throw new Error('Failed to load messages');
                }

                const data = await res.json();
                if (currentSessionId !== sessionId) return;
                const creatorNickname = data.session?.creator_nickname;
                renderMessages(data.messages || [], creatorNickname);

                document.getElementById('chatTitle').textContent = `Чат сессии: ${sessionId} (создатель: ${creatorNickname || 'неизвестно'})`;
                document.getElementById('chatViewer').classList.add('show');
                document.querySelector('.close-chat').focus();
            } catch (e) {
                alert('Ошибка загрузки чата: ' + e.message);
            }
        }

        function renderMessages(messages, creatorNickname) {
            audioPlayers.forEach(audio => audio.pause());
            audioPlayers.clear();
            const container = document.getElementById('chatMessages');

            if (messages.length === 0) {
                container.innerHTML = '<div class="no-data">Нет сообщений в этой сессии</div>';
                return;
            }

            container.innerHTML = messages.map(msg => {
                const time = new Date(msg.timestamp).toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                if (msg.from === 'system') {
                    return `
                        <div class="message system">
                            <div>${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    `;
                } else if (msg.type === 'voice') {
                    const className = msg.from === 'admin' ? 'admin' : 'controller';
                    const label = msg.from === 'admin' ? creatorNickname || 'Админ' : 'Пользователь';
                    const voiceUrl = `/voice/${encodeURIComponent(String(msg.voiceFile || ''))}`;
                    const audioId = 'audio_' + encodeURIComponent(String(msg.id)) + '_' + encodeURIComponent(String(msg.sessionId));

                    return `
                        <div class="message ${className}">
                            <div><strong>${escapeHtml(label)}:</strong></div>
                            <div class="voice-message">
                                <button class="voice-play-btn" aria-label="Воспроизвести или приостановить голосовое сообщение" data-audio-id="${escapeHtml(audioId)}" data-voice-url="${escapeHtml(voiceUrl)}">
                                    ▶
                                </button>
                                <span>Голосовое сообщение (${escapeHtml(msg.duration)})</span>
                            </div>
                            <div class="message-time">${time}</div>
                        </div>
                    `;
                } else {
                    const className = msg.from === 'admin' ? 'admin' : 'controller';
                    const label = msg.from === 'admin' ? creatorNickname || 'Админ' : 'Пользователь';

                    return `
                        <div class="message ${className}">
                            <div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    `;
                }
            }).join('');

            // Scroll to bottom
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && document.getElementById('chatViewer').classList.contains('show')) closeChatViewer();
        });

        function closeChatViewer() {
            audioPlayers.forEach(audio => audio.pause());
            document.getElementById('chatViewer').classList.remove('show');
            currentSessionId = null;
            if (chatReturnFocus && chatReturnFocus.isConnected) chatReturnFocus.focus();
            chatReturnFocus = null;
        }

        function updateStats() {
            const viewMode = document.getElementById('viewMode').value;
            const labels = viewMode === 'snippets'
                ? ['Всего изменений', 'Создано', 'Изменено', 'Удалено', 'Пользователей']
                : ['Всего сессий', 'Активные', 'Удалённые', 'Всего сообщений', 'Пользователей'];
            document.querySelectorAll('.stat-label').forEach((label, index) => { label.textContent = labels[index]; });

            if (viewMode === 'sessions') {
                const total = allSessions.length;
                const active = allSessions.filter(s => {
                    const isDeleted = s.deleted_at !== null && s.deleted_at !== undefined && s.deleted_at !== '';
                    // PostgreSQL возвращает BOOLEAN (true/false), а не INTEGER (0/1)
                    const isActive = s.is_active === true || s.is_active === 1;
                    const isRevoked = s.revoked === true || s.revoked === 1;
                    return isActive && !isRevoked && !isDeleted;
                }).length;
                const deleted = allSessions.filter(s => {
                    return s.deleted_at !== null && s.deleted_at !== undefined && s.deleted_at !== '';
                }).length;
                const totalMessages = allSessions.reduce((sum, s) => sum + (parseInt(s.message_count, 10) || 0), 0);

                document.getElementById('totalSessions').textContent = total;
                document.getElementById('activeSessions').textContent = active;
                document.getElementById('deletedSessions').textContent = deleted;
                document.getElementById('totalMessages').textContent = totalMessages;
                document.getElementById('totalUsers').textContent = allRegistrations.length;
            } else if (viewMode === 'snippets') {
                const created = allSnippetLogs.filter(l => l.action === 'create').length;
                const edited = allSnippetLogs.filter(l => l.action === 'edit').length;
                const deleted = allSnippetLogs.filter(l => l.action === 'delete').length;

                document.getElementById('totalSessions').textContent = allSnippetLogs.length;
                document.getElementById('activeSessions').textContent = created;
                document.getElementById('deletedSessions').textContent = edited;
                document.getElementById('totalMessages').textContent = deleted;
                document.getElementById('totalUsers').textContent = allRegistrations.length;
            } else {
                document.getElementById('totalSessions').textContent = allSessions.length;
                document.getElementById('activeSessions').textContent = '-';
                document.getElementById('deletedSessions').textContent = '-';
                document.getElementById('totalMessages').textContent = '-';
                document.getElementById('totalUsers').textContent = allRegistrations.length;
            }
        }

        function formatDate(date) {
            return date.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            return String(text ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        document.getElementById('sessionsList').addEventListener('click', event => {
            const action = event.target.closest('[data-view-session], [data-delete-session], [data-delete-user]');
            if (!action) return;
            event.stopPropagation();
            if (action.hasAttribute('data-view-session')) viewChat(action.dataset.viewSession);
            else if (action.hasAttribute('data-delete-session')) deleteSessionFromLogs(action.dataset.deleteSession);
            else deleteUser(action.dataset.deleteUser);
        });
        document.getElementById('chatMessages').addEventListener('click', event => {
            const button = event.target.closest('[data-voice-url]');
            if (button) playAudio(button.dataset.voiceUrl, button.dataset.audioId);
        });

        // Хранилище аудио плееров для каждого голосового сообщения
        const audioPlayers = new Map();

        function playAudio(url, buttonId) {
            // Генерируем уникальный ID если не передан
            if (!buttonId) {
                buttonId = 'audio_' + url.replace(/[^a-zA-Z0-9]/g, '_');
            }

            // Получаем или создаем аудио плеер
            let audio = audioPlayers.get(buttonId);

            if (!audio) {
                audio = new Audio(url);
                audioPlayers.set(buttonId, audio);

                // Обработчик окончания воспроизведения
                audio.addEventListener('ended', () => {
                    const btn = Array.from(document.querySelectorAll('[data-audio-id]')).find(button => button.dataset.audioId === buttonId);
                    if (btn) {
                        btn.innerHTML = '▶';
                        btn.classList.remove('playing');
                    }
                });
            }

            // Получаем кнопку
            const btn = Array.from(document.querySelectorAll('[data-audio-id]')).find(button => button.dataset.audioId === buttonId);

            // Переключаем воспроизведение/паузу
            if (audio.paused) {
                audio.play().catch(() => {
                    if (btn) { btn.textContent = '▶'; btn.classList.remove('playing'); }
                    showError('Не удалось воспроизвести голосовое сообщение.');
                });
                if (btn) {
                    btn.innerHTML = '⏸';
                    btn.classList.add('playing');
                }
            } else {
                audio.pause();
                if (btn) {
                    btn.innerHTML = '▶';
                    btn.classList.remove('playing');
                }
            }
        }

        async function exportLogs() {
            try {
                // Экспортируем все сессии с их сообщениями
                const exportData = {
                    exportDate: new Date().toISOString(),
                    exportedBy: currentNickname,
                    sessions: []
                };

                for (const session of allSessions) {
                    const res = await fetch(`/api/sessions/${encodeURIComponent(session.id)}/messages`, {
                        headers: { 'X-Nickname': currentNickname }
                    });

                    if (!res.ok) throw new Error('Не удалось загрузить сессию ' + session.id + '. Экспорт отменён, чтобы не выдавать неполный файл.');
                    if (res.ok) {
                        const data = await res.json();
                        exportData.sessions.push({
                            session: data.session,
                            messages: data.messages
                        });
                    }
                }

                const blob = new Blob([JSON.stringify(exportData, null, 2)], {
                    type: 'application/json'
                });

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lovense-logs-${new Date().toISOString().split('T')[0]}.json`;
                a.click();

                URL.revokeObjectURL(url);
                console.log('Логи экспортированы');
            } catch (e) {
                console.error('Ошибка экспорта:', e);
                showError('Ошибка экспорта: ' + e.message);
            }
        }

        // Фильтры
        document.getElementById('searchInput').addEventListener('input', () => {
            const viewMode = document.getElementById('viewMode').value;
            if (viewMode === 'sessions') {
                renderSessions();
            } else if (viewMode === 'snippets') {
                renderSnippetLogs();
            } else {
                renderRegistrations();
            }
        });
        document.getElementById('statusFilter').addEventListener('change', () => {
            if (document.getElementById('viewMode').value === 'sessions') renderSessions();
        });
        document.getElementById('viewMode').addEventListener('change', loadData);

        // Инициализация
        (async function () {
            accessGranted = await checkAccess();
            document.getElementById('appRoot').style.display = 'block';
            if (accessGranted) {
                await loadSessions();
                await loadRegistrations();
            } else {
                document.getElementById('appRoot').classList.add('access-denied');
            }
        })();

        // Автообновление каждые 30 секунд
        setInterval(() => {
            if (accessGranted) {
                loadData();
            }
        }, 30000);

        // === CLEANUP FUNCTIONS ===

        async function cleanupAllDeleted() {
            try {
                const res = await fetch('/api/logs/cleanup-all', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Nickname': currentNickname
                    }
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.error || 'Cleanup failed');
                }

                const data = await res.json();
                console.log(`Очистка выполнена. Удалено сессий: ${data.deleted}`);

                await loadData();
            } catch (e) {
                console.error('Ошибка очистки:', e);
                showError('Не удалось очистить историю: ' + e.message);
            }
        }

        async function deleteSessionFromLogs(sessionId) {
            if (!confirm(`Вы уверены, что хотите удалить сессию ${sessionId}?\n\nЭто действие необратимо и удалит:\n- Саму сессию\n- Все сообщения\n- Все логи этой сессии`)) {
                return;
            }

            try {
                const res = await fetch('/api/logs/delete-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Nickname': currentNickname
                    },
                    body: JSON.stringify({ sessionId })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(errorData.message || errorData.error || 'Delete failed');
                }

                console.log(`Сессия ${sessionId} успешно удалена из логов`);
                alert(`Сессия ${sessionId} успешно удалена!`);
                await loadData();
            } catch (e) {
                console.error('Ошибка удаления:', e);
                alert('Ошибка удаления сессии: ' + e.message + '\n\nПроверьте консоль для деталей.');
            }
        }

        async function deleteUser(nickname) {
            if (!confirm(`Вы уверены, что хотите удалить пользователя ${nickname}?\n\nЭто действие необратимо!\n\nПользователь будет выкинут с сайта в течение 30 секунд.`)) {
                return;
            }

            try {
                const res = await fetch('/api/users/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Nickname': currentNickname
                    },
                    body: JSON.stringify({ nickname })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    throw new Error(errorData.message || errorData.error || 'Delete failed');
                }

                console.log(`Пользователь ${nickname} успешно удален`);
                alert(`Пользователь ${nickname} успешно удален!\n\nОн будет выкинут с сайта в течение 30 секунд.`);
                await loadData();
            } catch (e) {
                console.error('Ошибка удаления пользователя:', e);
                alert('Ошибка удаления пользователя: ' + e.message);
            }
        }
    </script>
</body>
